<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TeleMusic · YouTube</title>
    <style>
        /* (те же стили, что и в предыдущих версиях, для краткости я их сократил) */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: system-ui, sans-serif; background: #0b0b0f; color: #eee; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .app { max-width: 420px; width: 100%; height: 100vh; max-height: 820px; background: #12121a; border-radius: 28px; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.8); overflow: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px 10px 22px; flex-shrink: 0; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; color: #fff; }
        .logo-icon { font-size: 26px; color: #ff0000; }
        .profile-btn { width: 40px; height: 40px; border-radius: 50%; background: #21212b; border: none; color: #ccc; font-size: 20px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .profile-btn:active { transform: scale(0.92); background: #2f2f3d; }
        .content { flex: 1; overflow-y: auto; padding: 0 20px 10px 20px; }
        .page { display: none; animation: fade 0.25s ease; }
        .page.active { display: block; }
        @keyframes fade { 0% { opacity: 0.4; transform: translateY(6px); } 100% { opacity: 1; transform: translateY(0); } }
        .welcome { margin: 8px 0 18px 0; }
        .welcome h1 { font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #ff4d4d, #ff0000); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .welcome p { color: #8888a0; font-size: 14px; margin-top: 2px; }
        .search-box { background: #1e1e2a; border-radius: 16px; padding: 8px 16px; display: flex; align-items: center; gap: 12px; margin-bottom: 16px; border: 1px solid #2a2a3a; transition: 0.2s; }
        .search-box:focus-within { border-color: #ff0000; box-shadow: 0 0 0 3px rgba(255,0,0,0.15); }
        .search-box span { font-size: 18px; opacity: 0.5; }
        .search-box input { background: transparent; border: none; outline: none; color: #eee; font-size: 15px; width: 100%; padding: 8px 0; }
        .search-box input::placeholder { color: #55556a; }
        .content h2 { font-size: 18px; font-weight: 600; margin-bottom: 14px; color: #ddd; display: flex; justify-content: space-between; align-items: center; }
        .content h2 small { font-weight: 400; font-size: 13px; color: #8888a0; }
        .loader { text-align: center; padding: 30px 0; color: #8888a0; font-size: 14px; }
        .loader .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #2a2a3a; border-top: 3px solid #ff0000; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .track-list { display: flex; flex-direction: column; gap: 8px; padding-bottom: 16px; }
        .track-item { display: flex; align-items: center; gap: 14px; background: #181822; padding: 10px 14px; border-radius: 14px; cursor: pointer; transition: 0.15s; border: 1px solid transparent; }
        .track-item:active { transform: scale(0.97); background: #20202e; }
        .track-item.active-track { border-color: #ff0000; background: #2a1a1a; }
        .track-cover { width: 48px; height: 48px; border-radius: 10px; background: #2a2a3a; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #ff0000; overflow: hidden; }
        .track-cover img { width: 100%; height: 100%; border-radius: 10px; object-fit: cover; }
        .track-info { flex: 1; min-width: 0; }
        .track-info .title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-info .artist { font-size: 13px; color: #8888a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-actions { display: flex; align-items: center; gap: 6px; }
        .track-actions button { background: none; border: none; color: #666680; font-size: 20px; cursor: pointer; padding: 4px; transition: 0.15s; line-height: 1; }
        .track-actions button:active { transform: scale(0.85); }
        .track-actions .fav-btn.liked { color: #ff5e7a; }
        .track-actions .play-btn-small { color: #ccc; font-size: 18px; }
        .page-title { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 18px 0; }
        .page-title h1 { font-size: 24px; font-weight: 700; }
        .page-title span { font-size: 14px; color: #8888a0; }
        .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; text-align: center; color: #55556a; }
        .empty .empty-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.4; }
        .empty h2 { font-size: 20px; font-weight: 600; color: #aaa; }
        .empty p { font-size: 14px; margin-top: 6px; }
        .player { flex-shrink: 0; background: #181825; border-top: 1px solid #262636; padding: 14px 20px 16px 20px; transition: 0.3s; display: flex; flex-direction: column; gap: 8px; }
        .player.hidden { display: none; }
        .player-track { display: flex; align-items: center; gap: 14px; }
        .player-track img { width: 44px; height: 44px; border-radius: 10px; background: #2a2a3a; object-fit: cover; }
        .player-info { flex: 1; min-width: 0; }
        .player-info strong { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-info span { font-size: 13px; color: #8888a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-heart { background: none; border: none; color: #666680; font-size: 24px; cursor: pointer; padding: 4px; transition: 0.15s; line-height: 1; }
        .player-heart:active { transform: scale(0.85); }
        .player-heart.liked { color: #ff5e7a; }
        .progress-container { width: 100%; padding: 4px 0; }
        .progress-container input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 4px; background: #2e2e40; outline: none; transition: 0.1s; }
        .progress-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #ff0000; cursor: pointer; box-shadow: 0 0 8px rgba(255,0,0,0.4); }
        .progress-container input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #ff0000; cursor: pointer; border: none; }
        .player-controls { display: flex; justify-content: center; align-items: center; gap: 24px; }
        .player-controls button { background: none; border: none; color: #ccc; font-size: 22px; cursor: pointer; padding: 6px 10px; transition: 0.12s; border-radius: 30px; line-height: 1; display: flex; align-items: center; justify-content: center; }
        .player-controls button:active { transform: scale(0.88); background: #2a2a3a; }
        .player-controls .play-button { width: 56px; height: 56px; border-radius: 50%; background: #ff0000; color: #fff; font-size: 26px; box-shadow: 0 4px 20px rgba(255,0,0,0.35); }
        .player-controls .play-button:active { transform: scale(0.92); background: #cc0000; }
        .navigation { display: flex; flex-shrink: 0; background: #12121a; border-top: 1px solid #1e1e2a; padding: 6px 0 10px 0; justify-content: space-around; }
        .nav-item { background: none; border: none; color: #55556a; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 22px; cursor: pointer; padding: 6px 20px; transition: 0.15s; border-radius: 20px; line-height: 1; }
        .nav-item small { font-size: 11px; font-weight: 500; letter-spacing: 0.3px; opacity: 0.7; }
        .nav-item.active { color: #ff0000; }
        .nav-item.active small { color: #ff0000; opacity: 1; }
        .nav-item:active { transform: scale(0.92); }
        @media (max-width: 440px) { .app { border-radius: 0; max-height: 100vh; height: 100vh; } .header { padding: 14px 16px 8px 16px; } .content { padding: 0 14px 6px 14px; } .player { padding: 10px 14px 12px 14px; } }
        @media (min-height: 800px) { .app { max-height: 860px; } }
    </style>
</head>
<body>
<div class="app">
    <header class="header">
        <div class="logo"><span class="logo-icon">▶</span><span>TeleMusic</span></div>
        <button class="profile-btn">👤</button>
    </header>
    <main class="content">
        <section id="homePage" class="page active">
            <div class="welcome"><h1>Слушай с YouTube</h1><p>Через Node.js бэкенд</p></div>
            <div class="search-box"><span>🔍</span><input id="searchInput" type="text" placeholder="Исполнитель или трек..." /></div>
            <h2 id="sectionTitle">Результаты <small id="resultCount"></small></h2>
            <div id="trackList" class="track-list">
                <div class="loader"><div class="spinner"></div><div>Введите запрос</div></div>
            </div>
        </section>
        <section id="favoritesPage" class="page">
            <div class="page-title"><h1>Избранное</h1><span id="favoritesCount">0 треков</span></div>
            <div id="favoritesList" class="track-list"></div>
            <div id="emptyFavorites" class="empty"><div class="empty-icon">♡</div><h2>Здесь пока пусто</h2><p>Добавляй понравившиеся треки в избранное</p></div>
        </section>
    </main>
    <div id="player" class="player hidden">
        <div class="player-track">
            <img id="playerCover" src="" alt="Обложка" />
            <div class="player-info"><strong id="playerTitle">Название</strong><span id="playerArtist">Исполнитель</span></div>
            <button id="playerFavorite" class="player-heart">♡</button>
        </div>
        <div class="progress-container"><input id="progress" type="range" min="0" max="100" value="0" /></div>
        <div class="player-controls">
            <button id="prevBtn">⏮</button>
            <button id="playBtn" class="play-button">▶</button>
            <button id="nextBtn">⏭</button>
        </div>
    </div>
    <nav class="navigation">
        <button class="nav-item active" data-page="homePage"><span>⌂</span><small>Главная</small></button>
        <button class="nav-item" data-page="favoritesPage"><span>♡</span><small>Избранное</small></button>
    </nav>
</div>

<script>
    // ================================================================
    //  ФРОНТЕНД ДЛЯ NODE.JS БЭКЕНДА
    // ================================================================
    const API_BASE = '/api';

    let currentTracks = [];
    let currentTrackIndex = 0;
    let isPlaying = false;
    let duration = 0;
    let favorites = new Set();

    try {
        const saved = JSON.parse(localStorage.getItem('teleMusicFavoritesNode') || '[]');
        if (Array.isArray(saved)) saved.forEach(id => favorites.add(id));
    } catch (_) {}

    // DOM
    const trackListEl = document.getElementById('trackList');
    const favoritesListEl = document.getElementById('favoritesList');
    const emptyFavoritesEl = document.getElementById('emptyFavorites');
    const favoritesCountEl = document.getElementById('favoritesCount');
    const sectionTitle = document.getElementById('sectionTitle');
    const resultCount = document.getElementById('resultCount');

    const playerEl = document.getElementById('player');
    const playerCover = document.getElementById('playerCover');
    const playerTitle = document.getElementById('playerTitle');
    const playerArtist = document.getElementById('playerArtist');
    const playerFavoriteBtn = document.getElementById('playerFavorite');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressInput = document.getElementById('progress');
    const searchInput = document.getElementById('searchInput');
    const navItems = document.querySelectorAll('.nav-item');
    const pages = {
        home: document.getElementById('homePage'),
        favorites: document.getElementById('favoritesPage'),
    };

    let audio = new Audio();

    // ===== Запросы к бэкенду =====
    async function searchTracks(query) {
        if (!query.trim()) {
            trackListEl.innerHTML = `<div class="loader"><div style="font-size:40px;margin-bottom:10px;">🎵</div><div>Введите исполнителя или трек</div></div>`;
            currentTracks = [];
            updateStats(0);
            return;
        }
        try {
            trackListEl.innerHTML = `<div class="loader"><div class="spinner"></div><div>Поиск...</div></div>`;
            const res = await fetch(`${API_BASE}/search?query=${encodeURIComponent(query)}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            if (data.tracks && data.tracks.length) {
                // Добавляем поле mp3 = пустая строка, будем загружать по клику
                currentTracks = data.tracks.map(t => ({ ...t, mp3: '' }));
                renderTracks();
                updateStats(currentTracks.length);
            } else {
                throw new Error('Ничего не найдено');
            }
        } catch (err) {
            console.error(err);
            trackListEl.innerHTML = `<div class="empty"><p style="color:#ff6b6b;">❌ ${err.message}</p></div>`;
            currentTracks = [];
            updateStats(0);
        }
    }

    async function getAudioUrl(videoUrl) {
        try {
            const res = await fetch(`${API_BASE}/audio?url=${encodeURIComponent(videoUrl)}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            return data.audioUrl || null;
        } catch (err) {
            console.error('Ошибка получения аудио:', err);
            return null;
        }
    }

    function updateStats(count) {
        sectionTitle.innerHTML = `Результаты <small>${count} треков</small>`;
    }

    // ===== Рендеринг =====
    function renderTracks() {
        if (!currentTracks.length) {
            trackListEl.innerHTML = `<div class="empty"><p style="color:#666;">Нет треков</p></div>`;
            return;
        }
        trackListEl.innerHTML = currentTracks.map((track, idx) => {
            const isActive = (idx === currentTrackIndex && audio.src === track.mp3);
            const liked = favorites.has(track.id);
            return `
                <div class="track-item ${isActive ? 'active-track' : ''}" data-index="${idx}">
                    <div class="track-cover"><img src="${track.cover || 'https://via.placeholder.com/48/2a2a3a/ff0000?text=YT'}" alt="${track.title}" loading="lazy" /></div>
                    <div class="track-info"><div class="title">${track.title}</div><div class="artist">${track.artist}</div></div>
                    <div class="track-actions">
                        <button class="play-btn-small" data-action="play" data-index="${idx}">▶</button>
                        <button class="fav-btn ${liked ? 'liked' : ''}" data-action="fav" data-id="${track.id}">${liked ? '♥' : '♡'}</button>
                    </div>
                </div>
            `;
        }).join('');

        trackListEl.querySelectorAll('[data-action="play"]').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); playTrack(+btn.dataset.index); });
        });
        trackListEl.querySelectorAll('[data-action="fav"]').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); toggleFavorite(btn.dataset.id); });
        });
        trackListEl.querySelectorAll('.track-item').forEach(el => {
            el.addEventListener('click', () => playTrack(+el.dataset.index));
        });
    }

    function renderFavorites() {
        const favTracks = currentTracks.filter(t => favorites.has(t.id));
        favoritesCountEl.textContent = `${favTracks.length} треков`;
        if (favTracks.length === 0) {
            favoritesListEl.innerHTML = '';
            emptyFavoritesEl.style.display = 'flex';
            return;
        }
        emptyFavoritesEl.style.display = 'none';
        favoritesListEl.innerHTML = favTracks.map((track) => {
            const idx = currentTracks.indexOf(track);
            const isActive = (idx === currentTrackIndex && audio.src === track.mp3);
            return `
                <div class="track-item ${isActive ? 'active-track' : ''}" data-index="${idx}">
                    <div class="track-cover"><img src="${track.cover || 'https://via.placeholder.com/48/2a2a3a/ff0000?text=YT'}" alt="${track.title}" loading="lazy" /></div>
                    <div class="track-info"><div class="title">${track.title}</div><div class="artist">${track.artist}</div></div>
                    <div class="track-actions">
                        <button class="play-btn-small" data-action="play" data-index="${idx}">▶</button>
                        <button class="fav-btn liked" data-action="fav" data-id="${track.id}">♥</button>
                    </div>
                </div>
            `;
        }).join('');

        favoritesListEl.querySelectorAll('[data-action="play"]').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); const i = +btn.dataset.index; if (i>=0 && i<currentTracks.length) playTrack(i); });
        });
        favoritesListEl.querySelectorAll('[data-action="fav"]').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); toggleFavorite(btn.dataset.id); });
        });
        favoritesListEl.querySelectorAll('.track-item').forEach(el => {
            el.addEventListener('click', () => { const i = +el.dataset.index; if (i>=0 && i<currentTracks.length) playTrack(i); });
        });
    }

    // ===== Плеер =====
    async function playTrack(index) {
        if (index < 0 || index >= currentTracks.length) return;
        const track = currentTracks[index];
        // Если mp3 ещё не загружено, получаем
        if (!track.mp3 && track.url) {
            try {
                const audioUrl = await getAudioUrl(track.url);
                if (audioUrl) {
                    track.mp3 = audioUrl;
                } else {
                    alert('Не удалось получить аудио');
                    return;
                }
            } catch (e) {
                alert('Ошибка получения аудио');
                return;
            }
        }
        if (!track.mp3) {
            alert('Аудио недоступно');
            return;
        }
        currentTrackIndex = index;
        playerCover.src = track.cover || 'https://via.placeholder.com/44/2a2a3a/ff0000?text=YT';
        playerTitle.textContent = track.title;
        playerArtist.textContent = track.artist;
        const liked = favorites.has(track.id);
        playerFavoriteBtn.textContent = liked ? '♥' : '♡';
        playerFavoriteBtn.classList.toggle('liked', liked);

        audio.src = track.mp3;
        audio.load();
        audio.currentTime = 0;
        progressInput.value = 0;
        audio.play()
            .then(() => { isPlaying = true; playBtn.textContent = '⏸'; playerEl.classList.remove('hidden'); })
            .catch(() => { isPlaying = false; playBtn.textContent = '▶'; playerEl.classList.remove('hidden'); });
        renderTracks();
        renderFavorites();
    }

    function togglePlay() {
        if (audio.paused) {
            audio.play().catch(() => {});
            playBtn.textContent = '⏸';
            isPlaying = true;
        } else {
            audio.pause();
            playBtn.textContent = '▶';
            isPlaying = false;
        }
    }

    function nextTrack() {
        if (!currentTracks.length) return;
        const next = (currentTrackIndex + 1) % currentTracks.length;
        playTrack(next);
    }

    function prevTrack() {
        if (!currentTracks.length) return;
        const prev = (currentTrackIndex - 1 + currentTracks.length) % currentTracks.length;
        playTrack(prev);
    }

    function toggleFavorite(id) {
        if (favorites.has(id)) favorites.delete(id);
        else favorites.add(id);
        localStorage.setItem('teleMusicFavoritesNode', JSON.stringify([...favorites]));
        const cur = currentTracks[currentTrackIndex];
        if (cur && cur.id === id) {
            const liked = favorites.has(id);
            playerFavoriteBtn.textContent = liked ? '♥' : '♡';
            playerFavoriteBtn.classList.toggle('liked', liked);
        }
        renderTracks();
        renderFavorites();
    }

    // ===== Аудио события =====
    audio.addEventListener('loadedmetadata', () => { duration = audio.duration; });
    audio.addEventListener('timeupdate', () => {
        if (duration > 0) progressInput.value = (audio.currentTime / duration) * 100;
    });
    audio.addEventListener('ended', nextTrack);

    // ===== UI события =====
    playBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', nextTrack);
    prevBtn.addEventListener('click', prevTrack);
    playerFavoriteBtn.addEventListener('click', () => {
        const track = currentTracks[currentTrackIndex];
        if (track) toggleFavorite(track.id);
    });
    progressInput.addEventListener('input', () => {
        if (duration > 0) audio.currentTime = (progressInput.value / 100) * duration;
    });

    let searchTimeout;
    searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => searchTracks(e.target.value), 400);
    });

    navItems.forEach(item => {
        item.addEventListener('click', () => {
            const pageId = item.dataset.page;
            navItems.forEach(n => n.classList.remove('active'));
            item.classList.add('active');
            Object.keys(pages).forEach(key => {
                pages[key].classList.toggle('active', key === pageId);
            });
            if (pageId === 'favoritesPage') renderFavorites();
            if (pageId === 'homePage') renderTracks();
        });
    });

    // ===== Старт =====
    trackListEl.innerHTML = `<div class="loader"><div style="font-size:40px;margin-bottom:10px;">🎵</div><div>Введите исполнителя или трек</div></div>`;
    renderFavorites();
    console.log('🎵 TeleMusic + Node.js бэкенд готов!');
</script>
</body>
</html>
